<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" role="img" aria-label="LyEve">
  <title>LyEve favicon</title>
  <!-- The inverted mark on the rounded Ink tile, the image every other icon draws.
       Each face is stroked in its own color so no dark seam shows between faces. -->
  <rect width="80" height="80" rx="17.6" fill="#0b1422"/>
  <g transform="translate(12 6)" stroke-width="0.35" stroke-linejoin="round">
    <polygon points="0,14 14,7 14,40 0,47" fill="#ffffff" stroke="#ffffff"/>
    <polygon points="0,47 14,40 14,54 0,61" fill="#9aa1ad" stroke="#9aa1ad"/>
    <polygon points="14,40 28,33 28,47 14,54" fill="#c5cad3" stroke="#c5cad3"/>
    <polygon points="14,54 28,47 56,33 42,40" fill="#00d4ff" stroke="#00d4ff"/>
    <polygon points="42,40 56,33 56,47 42,54" fill="#0099c4" stroke="#0099c4"/>
    <polygon points="14,54 28,61 42,54 28,47" fill="#00b4dd" stroke="#00b4dd"/>
    <polygon points="28,47 42,54 56,47 42,40" fill="#00b4dd" stroke="#00b4dd"/>
  </g>
</svg>

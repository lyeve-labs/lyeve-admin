name: Feature request
description: Suggest a new feature or improvement.
labels: ['enhancement', 'triage']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: checkboxes
    id: breaking
    attributes:
      label: Would this be a breaking change?
      options:
        - label: 'Yes, this changes existing API contracts or UI behavior'
        - label: 'No, this is purely additive'

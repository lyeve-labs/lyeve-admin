# Phase 1. VALIDATE
#
# The suite runs on every pull request into dev or main, and on every release:
# release.yml calls it on the tag and refuses to publish an image unless it is
# green. workflow_dispatch runs it against any other ref on demand.
#
# The suite with the visual editors in place runs only in release.yml. Fetching
# the editors takes secrets that belong to the release environment, which
# admits only a version tag, so a pull request cannot read them.

name: ci

on:
  pull_request:
    branches: [dev, main]
  # Called by release.yml on a version tag.
  workflow_call:
    inputs:
      ref:
        description: 'Ref to test. Empty means the ref that triggered the run.'
        type: string
        required: false
        default: ''
  # On demand, against any ref.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to test. Empty means the default branch.'
        type: string
        required: false
        default: ''

# A called run and a dispatched run can name the same ref, so the key carries
# both. Keyed on github.ref alone, a release would cancel a run someone had
# started by hand against the same commit. A pull request's ref is its own, so
# a new push to it cancels only its previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          # The secret scan reads history. A shallow clone gives it one commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.12.1
          cache: pnpm

      # The release workflow decides which image tags a release ref moves from
      # this script alone, so its rules are tested before any tag reaches it.
      - name: Image tag rules
        run: bash .github/scripts/image-tags_test.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pinned release binary rather than gitleaks-action, which needs an
      # organization license key. The archive is checked against the sha256 the
      # release publishes before anything in it runs.
      - name: Secret scan
        run: |
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --no-banner --redact --exit-code 1

      - name: Type-check (svelte-check)
        run: pnpm run check

      - name: UI consistency
        run: pnpm run lint:ui

      # Production dependencies ship to the browser, so an advisory in one is
      # a finding rather than a note, and this step fails on it.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Development dependencies run on the build and the CI runner, so a high
      # or critical advisory in one fails the run. Low and moderate advisories
      # are printed without failing it, because some have no fixed release.
      - name: Audit development dependencies
        run: pnpm audit --audit-level=high

      - name: Unit tests
        run: pnpm run test --run

      - name: Build
        run: pnpm run build
        env:
          # adapter-node refuses to build without an origin. The deployment
          # sets the real one at run time.
          ORIGIN: http://localhost:3002

# Phase 1. VALIDATE
#
# The suite runs on every pull request into dev or main, and on every release:
# release.yml calls it on the tag and refuses to publish an image unless it is
# green. workflow_dispatch runs it against any other ref on demand.

name: ci

on:
  pull_request:
    branches: [dev, main]
  # Called by release.yml on a version tag.
  workflow_call:
    inputs:
      ref:
        description: 'Ref to test. Empty means the ref that triggered the run.'
        type: string
        required: false
        default: ''
  # On demand, against any ref.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to test. Empty means the default branch.'
        type: string
        required: false
        default: ''

# A called run and a dispatched run can name the same ref, so the key carries
# both. Keyed on github.ref alone, a release would cancel a run someone had
# started by hand against the same commit. A pull request's ref is its own, so
# a new push to it cancels only its previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ inputs.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: build & test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          # The secret scan reads history. A shallow clone gives it one commit.
          fetch-depth: 0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The pinned release binary rather than gitleaks-action, which needs an
      # organization license key. The archive is checked against the sha256 the
      # release publishes before anything in it runs.
      - name: Secret scan
        run: |
          version=8.30.1
          sha256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "${sha256}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --config .gitleaks.toml \
            --no-banner --redact --exit-code 1

      - name: Type-check (svelte-check)
        run: pnpm run check

      - name: UI consistency
        run: pnpm run lint:ui

      # Production dependencies ship to the browser, so an advisory in one is
      # a finding rather than a note, and this step fails on it.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      # Development advisories reach the build and the CI runner rather than a
      # user, so they stay visible without blocking a release.
      - name: Audit development dependencies
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Unit tests
        run: pnpm run test --run

      - name: Build
        run: pnpm run build
        env:
          # Build needs *some* origin to satisfy adapter-node. Runtime ORIGIN
          # is supplied by the deployment, this is just to make the build pass.
          ORIGIN: http://localhost:3002
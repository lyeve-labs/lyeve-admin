# Phase 4. PUBLISH
#
# Triggered when a `vX.Y.Z` tag is pushed. Builds a multi-arch Docker image
# (linux/amd64 + linux/arm64) and pushes it to GHCR with three tags:
#   - X.Y.Z        (immutable, exact version, the git tag without its v)
#   - X.Y          (rolling, latest patch in the X.Y minor line)
#   - latest       (most recent release)
#
# A release candidate tag, `vX.Y.Z-rc.N`, runs the same suite and the same
# build and publishes one tag, X.Y.Z-rc.N. It never moves X.Y or latest.
# .github/scripts/image-tags.sh holds both rules and refuses any other tag.
#
# Image name matches the README and the repository: ghcr.io/lyeve-labs/lyeve-console:<tag>
# Every tag is also published as ghcr.io/lyeve-labs/lyeve-admin, the name the
# image had before, until the next minor release, so compose files that name
# it keep updating. Both names get the same tags under the same rules, and
# both point at one manifest list.
#
# Each architecture builds on a native runner of its own (ubuntu-24.04 for
# amd64, ubuntu-24.04-arm for arm64) and pushes by digest, and a final `merge`
# job joins the digests into one manifest list. Under QEMU on a hosted x64
# runner the arm64 SvelteKit and pnpm build hangs or runs out of memory.
#
# The workflow does not use docker/metadata-action, because that action
# calls the GitHub REST API, so a GitHub API degradation makes the release
# fail. Labels are static. Tags are derived from the git ref in shell. The
# only GitHub services this workflow needs are Git, Actions runners, and the
# Packages registry (GHCR). Never the REST API.
#
# The official image carries the visual flow and schema editors, a separate
# package under a commercial license. Each job that builds or tests the image
# checks it out at the commit .github/editors.ref pins, and the Docker build
# runs with REQUIRE_EDITORS=1, so a release without them fails rather than
# publishing the build from source. The ci.yml call still tests this
# repository alone.
#
# Secrets. Every stored one belongs to the `release` environment, which admits
# only a `v*` tag ref, and every job that reads one names it. Keep them out of
# the repository's own secrets, which a run dispatched from any branch could
# read. A manual re-publish is dispatched on the tag itself
# (`--ref vX.Y.Z -f tag=vX.Y.Z`).
#   GITHUB_TOKEN. Built-in, used to push to GHCR (no setup needed).
#   GHCR_TOKEN. Optional. When set, it pushes a package not linked to this
#   repository.
#   EDITORS_READ_TOKEN. Required. Reads the editors repository and nothing
#   else: a GitHub App token, or a fine-grained token with an expiry.
#   EDITORS_REPOSITORY. Required. owner/name of the editors repository. A
#   secret rather than a variable, so the name is masked in every log.

name: release

on:
  push:
    tags: ['v*.*.*']
  # Manual re-run for a tag that already exists: rebuild and republish the
  # image for an existing vX.Y.Z without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z or vX.Y.Z-rc.N tag to (re)build and publish'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lyeve-labs/lyeve-console
  # The previous name. It receives a copy of each manifest list IMAGE_NAME
  # gets, until the next minor release.
  LEGACY_IMAGE_NAME: lyeve-labs/lyeve-admin
  # The tag being released, whichever trigger asked for it.
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # A tag is a person's decision and the workflow it triggers is not, so this is
  # the only place the two meet: both build legs wait on the suite, run here on
  # the tag, and a red suite means no image.
  test:
    name: suite
    uses: ./.github/workflows/ci.yml
    # RELEASE_REF, spelled out: the env context is not in scope for a called
    # workflow's inputs. Without it a manual re-publish would test the default
    # branch and report it as the tag's suite.
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  # The suite again, with the editors in place: their own tests and the page
  # tests that drive them run only in a tree that carries them.
  suite-with-editors:
    name: suite with editors
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: ./.github/actions/fetch-editors
        with:
          repository: ${{ secrets.EDITORS_REPOSITORY }}
          token: ${{ secrets.EDITORS_READ_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 26.12.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: pnpm run check

      - name: Tests
        run: pnpm test

  build:
    name: build ${{ matrix.platform }}
    needs: [test, suite-with-editors]
    runs-on: ${{ matrix.runner }}
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      # A dispatch input is free-form, and a tag the tag rules cannot classify
      # must not build at all.
      - name: Validate release ref
        run: |
          if ! bash .github/scripts/image-tags.sh "${RELEASE_REF}" >/dev/null; then
            echo "::error::RELEASE_REF '${RELEASE_REF}' is not a vX.Y.Z or vX.Y.Z-rc.N tag"
            exit 1
          fi

      - uses: ./.github/actions/fetch-editors
        with:
          repository: ${{ secrets.EDITORS_REPOSITORY }}
          token: ${{ secrets.EDITORS_READ_TOKEN }}

      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR_TOKEN, when set, pushes a package not linked to this repository.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Static OCI labels. No metadata-action, so no GitHub REST API call.
      # `version` and `revision` come from the workflow context (env, not API).
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            REQUIRE_EDITORS=1
          labels: |
            org.opencontainers.image.title=lyeve-console
            org.opencontainers.image.description=LyEve Console, the browser app for a LyEve engine
            org.opencontainers.image.vendor=LyEve Labs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT AND LicenseRef-LyEve-Commercial
            org.opencontainers.image.version=${{ env.RELEASE_REF }}
            org.opencontainers.image.revision=${{ github.sha }}
          # push-by-digest is the canonical buildx multi-arch shape: each
          # platform uploads a manifest under no tag, and `merge` assembles the
          # list. It leaves no per-platform tags behind in the registry. The
          # digests go to the primary name only, and `merge` copies the list
          # to the previous name.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest & push tags
    runs-on: ubuntu-24.04
    environment: release
    needs: [build]
    steps:
      # The tag rules only, from the tag being released.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR_TOKEN, when set, pushes a package not linked to this repository.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Derive tags from the git tag in shell. No metadata-action, no REST API.
      #   v1.2.3 gives 1.2.3, 1.2 and latest. v1.2.3-rc.1 gives 1.2.3-rc.1 alone.
      # Both names publish this one list, so a candidate never moves the minor
      # line or latest under either name.
      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          ver="${RELEASE_REF#v}"
          tags=$(bash .github/scripts/image-tags.sh "${RELEASE_REF}" | tr '\n' ' ')
          echo "Publishing ${REGISTRY}/${IMAGE_NAME} and ${REGISTRY}/${LEGACY_IMAGE_NAME}: ${tags}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "tags=${tags% }" >> "$GITHUB_OUTPUT"

      - name: Create manifest list & push
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          for t in ${TAGS}; do args+=(-t "${REGISTRY}/${IMAGE_NAME}:${t}"); done
          docker buildx imagetools create "${args[@]}" \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      # A single source that is already a manifest list is copied as it is, so
      # the previous name gets the same digest, not a rebuilt list.
      - name: Copy to the previous name
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          args=()
          for t in ${TAGS}; do args+=(-t "${REGISTRY}/${LEGACY_IMAGE_NAME}:${t}"); done
          docker buildx imagetools create "${args[@]}" "${REGISTRY}/${IMAGE_NAME}:${VERSION}"

      - name: Inspect
        env:
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          primary=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${REGISTRY}/${IMAGE_NAME}:${VERSION}")
          legacy=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${REGISTRY}/${LEGACY_IMAGE_NAME}:${VERSION}")
          if [ "$primary" != "$legacy" ]; then
            echo "::error::${LEGACY_IMAGE_NAME}:${VERSION} is ${legacy}, ${IMAGE_NAME}:${VERSION} is ${primary}"
            exit 1
          fi
          echo "both names: ${primary}"

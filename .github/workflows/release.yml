# Phase 4. PUBLISH
#
# Triggered when a `vX.Y.Z` tag is pushed. Builds a multi-arch Docker image
# (linux/amd64 + linux/arm64) and pushes it to GHCR with three tags:
#   - vX.Y.Z       (immutable, exact version)
#   - X.Y          (rolling, latest patch in the X.Y minor line)
#   - latest       (most recent release)
#
# Image name matches the README and the repository: ghcr.io/lyeve-labs/lyeve-admin:<tag>
#
# Multi-arch strategy: each architecture builds on its OWN native runner
# (ubuntu-24.04 for amd64, ubuntu-24.04-arm for arm64) and pushes by digest.
# A final `merge` job stitches the per-arch digests into one manifest list.
# This deliberately avoids QEMU emulation, under which the arm64 SvelteKit and
# pnpm build hangs or runs out of memory on a hosted x64 runner.
#
# This workflow deliberately does NOT use docker/metadata-action: that action
# calls the GitHub REST API, so a GitHub API degradation makes the release
# fail. Labels are static. Tags are derived from the git ref in shell. The
# only GitHub services this workflow needs are Git, Actions runners, and the
# Packages registry (GHCR). Never the REST API.
#
# The official image carries the visual flow and schema editors, a separate
# package under a commercial license. Each job that builds or tests the image
# checks it out at the commit .github/editors.ref pins, and the Docker build
# runs with REQUIRE_EDITORS=1, so a release without them fails rather than
# publishing the build from source. The ci.yml call still tests this
# repository alone.
#
# Secrets:
#   GITHUB_TOKEN. Built-in, used to push to GHCR (no setup needed).
#   GHCR_TOKEN. Optional. When set, it pushes a package not linked to this
#   repository.
#   EDITORS_READ_TOKEN. Required. Reads the editors repository and nothing
#   else: a GitHub App token, or a fine-grained token with an expiry.
#   EDITORS_REPOSITORY. Required. owner/name of the editors repository. A
#   secret rather than a variable, so the name is masked in every log.

name: release

on:
  push:
    tags: ['v*.*.*']
  # Manual re-run for a tag that already exists: rebuild and republish the
  # image for an existing vX.Y.Z without cutting a new version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vX.Y.Z tag to (re)build and publish'
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write   # for sigstore/cosign keyless signing if added later

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: lyeve-labs/lyeve-admin
  # The tag being released, whichever trigger asked for it.
  RELEASE_REF: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # A tag is a person's decision and the workflow it triggers is not, so this is
  # the only place the two meet: both build legs wait on the suite, run here on
  # the tag, and a red suite means no image.
  test:
    name: suite
    uses: ./.github/workflows/ci.yml
    # RELEASE_REF, spelled out: the env context is not in scope for a called
    # workflow's inputs. Without it a manual re-publish would test the default
    # branch and report it as the tag's suite.
    with:
      ref: ${{ github.event.inputs.tag || github.ref_name }}

  # The suite again, with the editors in place: their own tests and the page
  # tests that drive them run only in a tree that carries them.
  suite-with-editors:
    name: suite with editors
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: ./.github/actions/fetch-editors
        with:
          repository: ${{ secrets.EDITORS_REPOSITORY }}
          token: ${{ secrets.EDITORS_READ_TOKEN }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        run: pnpm run check

      - name: Tests
        run: pnpm test

  build:
    name: build ${{ matrix.platform }}
    needs: [test, suite-with-editors]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ env.RELEASE_REF }}
          persist-credentials: false

      - uses: ./.github/actions/fetch-editors
        with:
          repository: ${{ secrets.EDITORS_REPOSITORY }}
          token: ${{ secrets.EDITORS_READ_TOKEN }}

      - name: Prepare platform slug
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR_TOKEN, when set, pushes a package not linked to this repository.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Static OCI labels. No metadata-action, so no GitHub REST API call.
      # `version` and `revision` come from the workflow context (env, not API).
      - name: Build & push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: |
            REQUIRE_EDITORS=1
          labels: |
            org.opencontainers.image.title=lyeve-admin
            org.opencontainers.image.description=LyEve CMS Admin UI
            org.opencontainers.image.vendor=LyEve Labs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT AND LicenseRef-LyEve-Commercial
            org.opencontainers.image.version=${{ env.RELEASE_REF }}
            org.opencontainers.image.revision=${{ github.sha }}
          # push-by-digest is the canonical buildx multi-arch shape: each
          # platform uploads a manifest under no tag, and `merge` assembles the
          # list. It leaves no per-platform tags behind in the registry.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest & push tags
    runs-on: ubuntu-24.04
    needs: [build]
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # GHCR_TOKEN, when set, pushes a package not linked to this repository.
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      # Derive tags from the git tag in shell. No metadata-action, no REST API.
      #   refs/tags/v1.2.3 → ${GITHUB_REF_NAME}=v1.2.3 → 1.2.3, 1.2, latest
      - name: Compute image tags
        id: tags
        run: |
          ver="${RELEASE_REF#v}"
          minor="${ver%.*}"
          img="${REGISTRY}/${IMAGE_NAME}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "args=-t ${img}:${ver} -t ${img}:${minor} -t ${img}:latest" >> "$GITHUB_OUTPUT"

      - name: Create manifest list & push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create ${{ steps.tags.outputs.args }} \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect
        run: |
          docker buildx imagetools inspect \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.tags.outputs.version }}
